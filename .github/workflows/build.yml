
  name: buildOnly

  on:
    push:
      branches:
        - develop
        - feature/*
    pull_request:
      branches:
        - develop

  jobs:

    build:

      name: Gradle Build

      runs-on: ubuntu-latest

      steps:

        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 21

        - name: Grant Execute Permission
          run: chmod +x gradlew

        - name: print workspace info
          run: |
            echo "current dir"
            pwd
            echo "list files"
            ls -la
            echo "java version"
            java -version

        - name: Build Application
          run: ./gradlew clean build
